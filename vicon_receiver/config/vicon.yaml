# Parameters for the vicon_client node.
#
# Connection and frame-name settings stay on the launch file as arguments (hostname, buffer_size,
# topic_namespace, world_frame, vicon_frame, map_xyz, map_rpy); this file holds the rest.
vicon_client:
  ros__parameters:
    # Vicon subject name of the drone, exactly as Tracker reports it. Its pose the first time it
    # is seen becomes the world origin, so the drone reads (0,0,0) / (0,0,0,1) where it booted.
    # Other tracked bodies are expressed in that same frame. Required.
    origin_subject: "x500"
